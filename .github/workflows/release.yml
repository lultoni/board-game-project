name: Release

# Tag-triggered desktop release pipeline. Five matrix jobs produce the
# artefacts attached to the GitHub Release for the tag:
#
#   - macOS Apple Silicon   → .dmg          (CPU + wgpu/Metal)
#   - Linux x86_64          → .AppImage     (CPU + wgpu/Vulkan)
#   - Linux x86_64 CUDA     → .AppImage     (CPU + CUDA; separate download)
#   - Windows x86_64        → .msi + .exe   (CPU + wgpu/DX12)
#   - Windows x86_64 CUDA   → .msi + .exe   (CPU + CUDA; separate download)
#
# The CUDA builds are their own jobs because burn-cuda requires the CUDA
# Toolkit 12.x at link time. End users grab whichever artefact matches their
# machine; the launched app exposes a runtime backend dropdown.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
            target: aarch64-apple-darwin
            features: backend-ndarray,backend-wgpu
            config: ""
            artefact_glob: |
              game/target/release/bundle/dmg/*.dmg
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: backend-ndarray,backend-wgpu
            config: ""
            artefact_glob: |
              game/target/release/bundle/appimage/*.AppImage
          - name: linux-cuda
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: backend-ndarray,backend-cuda
            config: "tauri.cuda.conf.json"
            artefact_glob: |
              game/target/release/bundle/appimage/*.AppImage
          - name: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
            features: backend-ndarray,backend-wgpu
            config: ""
            artefact_glob: |
              game/target/release/bundle/msi/*.msi
              game/target/release/bundle/nsis/*.exe
          - name: windows-cuda
            os: windows-2022
            target: x86_64-pc-windows-msvc
            features: backend-ndarray,backend-cuda
            config: "tauri.cuda.conf.json"
            artefact_glob: |
              game/target/release/bundle/msi/*.msi
              game/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "game -> target"
          key: ${{ matrix.name }}

      # AppImage tooling + GPU drivers for the wgpu Linux build.
      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            libvulkan-dev

      - name: Install CUDA Toolkit (Linux)
        if: matrix.name == 'linux-cuda'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.5.0"
          method: "network"

      - name: Install CUDA Toolkit (Windows)
        if: matrix.name == 'windows-cuda'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.5.0"
          method: "network"
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "thrust", "visual_studio_integration"]'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend deps
        working-directory: game/frontend
        run: npm ci

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # Tauri's AppImage bundler downloads four helper files from
      # github.com / raw.githubusercontent.com with no retry on 429. Shared
      # runner IPs get throttled; the build then fails with
      # `Error failed to bundle project: http status: 429`. Pre-populate the
      # bundler's cache with curl's own retry so we don't depend on Tauri
      # gaining retry logic. Tracked upstream in tauri-apps/tauri#11468.
      - name: Pre-cache Tauri AppImage tooling (avoid GitHub 429)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/tauri"
          cd "$HOME/.cache/tauri"
          curl_dl() { curl --retry 5 --retry-delay 15 --retry-all-errors -fSL "$1" -o "$2"; }
          curl_dl https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64 AppRun-x86_64
          curl_dl https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage linuxdeploy-x86_64.AppImage
          curl_dl https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh linuxdeploy-plugin-gtk.sh
          curl_dl https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh linuxdeploy-plugin-gstreamer.sh
          chmod +x AppRun-x86_64 linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh linuxdeploy-plugin-gstreamer.sh

      - name: Build desktop bundle
        working-directory: game/crates/tauri_wrapper
        shell: bash
        env:
          VITE_RELAY_URL: ${{ secrets.VITE_RELAY_URL }}
          VITE_RELAY_HTTP_URL: ${{ secrets.VITE_RELAY_HTTP_URL }}
        run: |
          cargo tauri build ${{ matrix.config != '' && format('--config {0}', matrix.config) || '' }} -- --no-default-features --features "${{ matrix.features }}"

      - name: Upload artefacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artefact_glob }}
          fail_on_unmatched_files: false
          draft: true
          body: |
            Desktop builds for `${{ github.ref_name }}`.

            - **macOS (Apple Silicon)** — `.dmg`. Ad-hoc signed; on first launch macOS will say the app is damaged. Workaround until v0.2 signing: `xattr -cr "/Applications/(game-name).app"` after dragging to Applications, then double-click.
            - **Linux x86_64** — `.AppImage` (CPU + GPU via wgpu/Vulkan). `chmod +x` then run.
            - **Linux x86_64 + CUDA** — `.AppImage` (CPU + NVIDIA CUDA). Requires CUDA 12.x runtime.
            - **Windows x86_64** — `.msi` or `.exe` (CPU + GPU via wgpu/DX12).
            - **Windows x86_64 + CUDA** — `.msi` or `.exe` (CPU + NVIDIA CUDA). Requires CUDA 12.x runtime.

            In the app, open the Training Observatory and pick a backend from the dropdown.
