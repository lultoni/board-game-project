name: Release

# Tag-triggered desktop release pipeline. Three matrix jobs produce the
# artefacts attached to the GitHub Release for the tag:
#
#   - macOS Apple Silicon  → universal .dmg (CPU + wgpu/Metal)
#   - Linux x86_64         → .AppImage     (CPU + wgpu/Vulkan)
#   - Linux x86_64 CUDA    → .AppImage     (CPU + CUDA; separate download)
#
# The CUDA build is its own job because burn-cuda requires the CUDA Toolkit
# 12.x at link time. End users grab whichever artefact matches their
# machine; the launched app exposes a runtime backend dropdown.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
            target: aarch64-apple-darwin
            features: backend-ndarray,backend-wgpu
            config: ""
            artefact_glob: |
              game/target/release/bundle/dmg/*.dmg
              game/target/release/bundle/macos/*.app.tar.gz
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: backend-ndarray,backend-wgpu
            config: ""
            artefact_glob: |
              game/target/release/bundle/appimage/*.AppImage
              game/target/release/bundle/deb/*.deb
          - name: linux-cuda
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: backend-ndarray,backend-cuda
            config: "../tauri.cuda.conf.json"
            artefact_glob: |
              game/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "game -> target"
          key: ${{ matrix.name }}

      # AppImage tooling + GPU drivers for the wgpu Linux build.
      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            libvulkan-dev

      - name: Install CUDA Toolkit
        if: matrix.name == 'linux-cuda'
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: "12.5.0"
          method: "network"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - name: Frontend deps
        working-directory: game/frontend
        run: npm ci

      - name: Build WASM engine
        working-directory: game/frontend
        run: npm run build:wasm

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build desktop bundle
        working-directory: game/crates/tauri_wrapper
        run: |
          cargo tauri build \
            --no-default-features \
            --features "${{ matrix.features }}" \
            ${{ matrix.config != '' && format('--config {0}', matrix.config) || '' }}

      - name: Upload artefacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artefact_glob }}
          fail_on_unmatched_files: false
          draft: true
          body: |
            Desktop builds for `${{ github.ref_name }}`.

            - **macOS (Apple Silicon)** — `.dmg`. Ad-hoc signed; right-click → Open on first launch.
            - **Linux x86_64** — `.AppImage` (CPU + GPU via wgpu/Vulkan).
            - **Linux x86_64 + CUDA** — `.AppImage` (CPU + NVIDIA CUDA). Requires CUDA 12.x runtime.

            In the app, open the Training Observatory and pick a backend from the dropdown.
