[workspace]
resolver = "2"
members = [
    "crates/core_engine",
    "crates/tauri_wrapper",
    "crates/search_bench",
    "crates/nn_trainer",
]

[workspace.package]
version = "0.1.1"
edition = "2026"
authors = ["Elias Leander Glauert"]
license = "Unlicense"

[workspace.dependencies]
core_engine = { path = "crates/core_engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
