[workspace]
resolver = "2"
members = [
    "crates/core_engine",
    "crates/wasm_wrapper",
    "crates/tauri_wrapper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Elias"]
license = "Unlicense"

[workspace.dependencies]
core_engine = { path = "crates/core_engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release-wasm]
inherits = "release"
opt-level = "z"
