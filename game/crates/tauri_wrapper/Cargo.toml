[package]
name = "tauri_wrapper"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tauri 2 desktop wrapper exposing core_engine via IPC to the Svelte frontend."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core_engine = { workspace = true }
nn_trainer = { path = "../nn_trainer", default-features = false }
tauri = { version = "2", features = ["devtools"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
default = ["backend-ndarray", "backend-wgpu"]
custom-protocol = ["tauri/custom-protocol"]
backend-ndarray = ["nn_trainer/backend-ndarray"]
backend-wgpu    = ["nn_trainer/backend-wgpu"]
backend-cuda    = ["nn_trainer/backend-cuda"]
