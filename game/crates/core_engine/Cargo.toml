[package]
name = "core_engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure Rust game engine for (GAME NAME). Stateless math; no I/O; no platform deps."

[lib]
crate-type = ["rlib"]

[features]
# Optional per-section instrumentation for the bench crate. Off by default so
# release builds (Tauri, nn_trainer, etc.) don't pay per-call TLS load/store
# costs on the eval/search hot path. Enable with:
#   cargo build --features bench_counters
# or from a dependent crate's Cargo.toml.
bench_counters = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rand = "0.8"
