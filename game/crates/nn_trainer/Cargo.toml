[package]
name = "nn_trainer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NN position-rater trainer for (GAME NAME). Native-only, rayon-parallel self-play; ndarray-backed burn. See design/inbox/digital/nn-rater-plan.md."

[lib]
crate-type = ["rlib"]

[features]
# Backend features are additive: enabling several gives the resulting
# binary the runtime choice between them via `BackendChoice`. The default
# release binary bundles ndarray (CPU) + wgpu (Metal / Vulkan / DX12).
# `backend-cuda` is opt-in and produces a separate Linux-only artefact -
# `burn-cuda` requires CUDA Toolkit 12.x at build time and won't compile
# on Mac.
default = ["backend-ndarray", "backend-wgpu"]
backend-ndarray = ["burn/ndarray"]
backend-wgpu    = ["burn/wgpu"]
backend-cuda    = ["burn/cuda"]

[dependencies]
core_engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# burn = autograd + optimisers + serialisation (ADR-007). The concrete backend
# is selected via the `backend-*` features above; this base entry only enables
# the cross-backend pieces (autograd + serde + std).
burn = { version = "0.21", default-features = false, features = ["train", "std"] }
# Self-play data generation: deterministic RNG (seeded loadouts + game seeds)
# and parallel execution (corpus generation is embarrassingly parallel).
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rayon = "1.10"
# Stable portable SIMD (SSE2/AVX2 on x86_64, NEON on aarch64) for the quantized
# NNUE tail's integer dot products. Native-only crate; no WASM concern (ns-50).
wide = "1.5"
