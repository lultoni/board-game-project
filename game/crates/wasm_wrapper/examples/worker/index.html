<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wasm_wrapper — Worker Smoke Test</title>
<style>
  body { font-family: ui-monospace, Menlo, monospace; margin: 2rem; max-width: 64rem; }
  #log { background: #111; color: #eee; padding: 1rem; white-space: pre; height: 24rem; overflow: auto; }
  button { margin-right: .5rem; padding: .4rem .8rem; }
</style>
</head>
<body>
<h1>wasm_wrapper worker harness</h1>
<p>Open the browser devtools console + this page from a local static server (the wasm module needs an http origin):</p>
<pre>cd game/crates/wasm_wrapper/examples/worker
python3 -m http.server 8765
# then open http://localhost:8765/</pre>

<div>
  <button id="init">Init</button>
  <button id="legal">Legal actions</button>
  <button id="ai">Step AI</button>
  <button id="snap">Snapshot</button>
</div>
<pre id="log"></pre>

<script type="module">
const logEl = document.getElementById('log');
const log = (s) => { logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; };

const worker = new Worker(new URL('./worker.js', import.meta.url), { type: 'module' });

worker.onmessage = (ev) => {
  const m = ev.data;
  switch (m.type) {
    case 'ready':    log(`[ready] engine v${m.version}`); break;
    case 'state':    log(`[state] toMove=${m.phase.toMove} phase=${m.phase.currentPhase} round=${m.phase.roundNumber} result=${m.phase.gameResult} zobrist=0x${m.phase.zobrist.toString(16)}`); break;
    case 'legal':    log(`[legal] ${m.actions.length} actions`); break;
    case 'step':     log(`[step] applied=0x${m.result.appliedAction.toString(16)} score=${m.result.score} d=${m.result.depth} nodes=${m.result.nodes} ms=${m.result.thoughtMs} result=${m.result.gameResult}`); break;
    case 'snapshot': log(`[snapshot] ${m.json.length} bytes`); break;
    case 'error':    log(`[ERROR] ${m.message}`); break;
  }
};

document.getElementById('init').onclick  = () => worker.postMessage({ type: 'init' });
document.getElementById('legal').onclick = () => worker.postMessage({ type: 'legal' });
document.getElementById('ai').onclick    = () => worker.postMessage({ type: 'stepAi' });
document.getElementById('snap').onclick  = () => worker.postMessage({ type: 'snapshot' });
</script>
</body>
</html>
