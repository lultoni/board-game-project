[package]
name = "search_bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Search-speed benchmark for core_engine. FEN-driven corpus, two modes (fixed-depth + fixed-time), correctness regression test."

[[bin]]
name = "search_bench"
path = "src/main.rs"

[dependencies]
core_engine = { workspace = true, features = ["bench_counters"] }
nn_trainer = { path = "../nn_trainer", default-features = false, features = ["backend-ndarray"] }
serde = { workspace = true }
serde_json = { workspace = true }
